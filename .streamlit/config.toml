[client]
# Réduit le menu ⋮ au strict minimum pour les visiteurs (pas d'options de
# développeur type "Rerun"/"Clear cache" — inutiles et pas très "appli pro").
toolbarMode = "minimal"

[theme]
base = "dark"
font = "serif"

[theme.dark]
primaryColor = "#c9a227"
backgroundColor = "#0e0e0e"
secondaryBackgroundColor = "#1a1a1a"
textColor = "#f2ead9"

[theme.light]
primaryColor = "#8a6d3b"
backgroundColor = "#faf8f5"
secondaryBackgroundColor = "#eef0f4"
textColor = "#1c2333"
